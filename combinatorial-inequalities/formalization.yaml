# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: Combinatorial Inequalities — universal permutation, additive-set, and graph theorems
  description: >-
    A self-contained, zero-Mathlib Lean 4 formalization of universal combinatorial inequalities
    and counterexample disproofs discovered through binary math. Proves West stack vs.
    pop-stack inversion dominance inv(S(p)) <= inv(P(p)), the sharp factor-3 two-stack bound
    3 * inv(S^2(p)) <= pat231(p) on Av(321), des(S(p)) <= peaks(p), quantitative reflection-asymmetry
    and difference-folding bounds for finite integer subsets, quantitative graph diameter and
    irregularity bounds, and two explicit disproofs.
  repository: https://github.com/MoteMath/math-research
  subdirectory: combinatorial-inequalities
  license: Apache-2.0
