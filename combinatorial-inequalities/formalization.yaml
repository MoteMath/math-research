# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: Combinatorial Inequalities — permutation stack-sorting and additive-set bounds
  description: >-
    A self-contained, zero-Mathlib Lean 4 formalization of universal permutation and additive-set
    inequalities: the sharp factor-3 two-stack bound 3 * inv(S^2(p)) <= pat231(p) on Av(321),
    des(S(p)) <= peaks(p), the quadratic descent-excess Spearman bound on Av(231), and the
    difference-folding bound 3 |A - A| <= 2 |2A - A| + 1 for finite integer subsets.
  repository: https://github.com/MoteMath/math-research
  subdirectory: combinatorial-inequalities
  license: Apache-2.0
