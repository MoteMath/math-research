version: v0.4

project:
  name: Exact Low-Precision SSM / Mamba-2 Decay Collapse, Additive Swamping, and Dyadic Shift-Subtract Invariants
  description: >-
    A complete, sorry-free, pure-Init (zero Mathlib) Lean 4 formalization proving the exact IEEE-754 RNE
    decay-stall midpoint law across arbitrary mantissa widths p >= 1 (FP8-E5M2, FP8-E4M3, BF16, FP16, FP32),
    the universal one-ULP-per-step sequential decay collapse law seq_pow(p, m * 2^p) = 2^(-m), exact linear
    additive swamping divergence T * 2^(-(p+1)), tight asymmetric signed-integer invariant bounds
    [-2^R B_max, 2^R B_max + (2^R - 1)] and zero-input stall asymmetry for zero-multiplier shift-subtract
    recurrences, and exact 2 -> 3/2 adjacent decay-rate gap reduction via 2-tap CSD shift-subtract.
  repository: https://github.com/MoteMath/math-research
  subdirectory: ssm-decay-collapse-bounds
  license: Apache-2.0
