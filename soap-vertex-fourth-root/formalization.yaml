version: v0.4

project:
  name: SOAP Vertex Fourth-Root — vertex-form BF16/FP8-safe matrix inverse fourth-root polynomials & FP8 linear crossover
  description: >-
    A complete, sorry-free, pure-Init (zero Mathlib) Lean 4 formalization of vertex-form quadratic
    matrix inverse-fourth-root (G^{-1/4}) polynomials for Shampoo/SOAP preconditioners, proving exact
    completed-square equivalence and global positivity, the exact Taylor-2 vertex identity and cubic
    convergence residual, exact pointwise adversarial rounding envelopes for both vertex-form and
    linear coupled iterations, and continuous 5-step worst-case trajectory confinement across BF16
    (eps = 10^-2 and 10^-4), hybrid FP8, and the pure FP8 E4M3 linear crossover via a cleared-denominator
    Int interval certificate engine with zero native_decide.
  repository: https://github.com/MoteMath/math-research
  subdirectory: soap-vertex-fourth-root
  license: Apache-2.0
