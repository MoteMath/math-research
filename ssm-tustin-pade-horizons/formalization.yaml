# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: Exact Low-Precision SSM Discretization Horizons: Tustin Nyquist Snap, ZOH 2x Stall & Blackout, Pade-(0,2) Contraction, and Trajectory Energy Laws
  description: >-
    A complete, sorry-free, pure-Init (zero Mathlib) Lean 4 formalization proving six exact
    IEEE-754 RNE, rational approximation, and trajectory stability laws for low-precision
    State-Space Model (SSM) discretization across FP8-E5M2, FP8-E4M3, BF16, and FP16:
    (1) exact Tustin Nyquist snap-to-(-1.0) horizon at z_osc(p) = 2^(p+1) + 8 (24, 40, 520, 4104)
    in two-step IEEE-754 RNE fl(fl(2-z)/fl(2+z)) plus exact single-rounding threshold 4/(z+2) <= 2^(-(p+1));
    (2) exact 2x infinite-memory stall separation between Tustin/Pade-(0,2) (z <= 2^(-p)) and ZOH
    (z <= 2^(-(p+1)));
    (3) exact 100% catastrophic cancellation blackout of naive ZOH input gain fl((1-fl(e^-z))/z) = 0
    for all z <= 2^(-(p+1)), erasing 15104/16256 = 118/127 (>92.91%) of BF16 (0,1] representables;
    (4) unconditional positivity and contraction 0 < A_pade02(z) < 1, exact O(z^3) Taylor matching,
    and the FP8-E4M3FN no-Inf overflow cliff at 448;
    (5) subtraction-free Pade-(0,2) input gain B_pade02(z) = 1/(1 + z/2 + z^2/12) with 0% blackout,
    exact 4th-order O(z^4) matching against (1-e^-z)/z, and strictly tighter (0,1] error than B_tustin;
    (6) exact inductive SSM trajectory energy blowup under Nyquist snap (a = -1) and stall (a = 1)
    versus uniform boundedness |h_T| <= |b|/(1-a) for contractive Pade-(0,2) poles.
  repository: https://github.com/MoteMath/math-research
  subdirectory: ssm-tustin-pade-horizons
  license: Apache-2.0
