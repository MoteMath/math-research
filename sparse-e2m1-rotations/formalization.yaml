# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: Sparse E2M1 Rotations — exact doubly-2:4-sparse Walsh-Hadamard factorizations, coherence lower bounds, and E2M1-native orthogonal matrices
  description: >-
    A complete, sorry-free, pure-Init (zero Mathlib) Lean 4 formalization proving universal doubly-2:4-sparse
    orthogonal factorizations of all 2^(k+2) x 2^(k+2) Walsh-Hadamard matrices, the sharp single-2:4 coherence
    lower bound N * M^2 >= 2c attained by Walsh weighing matrices, universal skew-conference E2M1-native
    orthogonality (including exact power-of-2 Q32 with norm 16^2 and NVFP4 winner Q16 with norm 31), and
    universal doubly-2:4-sparse E2M1-native Givens-Hadamard rotations G_{4*2^k}(1, 2).
  repository: https://github.com/MoteMath/math-research
  subdirectory: sparse-e2m1-rotations
  license: Apache-2.0
